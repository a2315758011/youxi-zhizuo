name: 游戏仓库质量检查

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 检查技能资料库
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 获取仓库
        uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 检查技能元数据、数量和核心索引
        run: python tools/validate_game_repo.py
